# The test build's twin, for a released version. Fires on the version tag,
# which is pushed after the merge to the default branch, so the tag is always
# on merged code.
#
# Three differences from test-build.yml: it runs on the tag rather than on a
# branch, the version is the one already in package.json rather than a
# prerelease invented here, and nothing is pruned. Every release keeps its own
# tag and its own asset, because these are the history, where the test build is
# only ever a drop box.
#
# ---------------------------------------------------------------------------
# PRIVATE REPOSITORIES ONLY. A public plugin gets its released tarball from
# npm, so it uses publish.yml instead and does not need this file. The job
# guard below makes the workflow a no-op if a repository is ever made public,
# rather than quietly producing a second, worse install route.
#
# Fill in before use:
#   <node-version>   the lowest major in package.json engines.node, quoted,
#                    e.g. '20' or '22'
#
# Everything else is derived at run time.
# ---------------------------------------------------------------------------

name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --if-present

      # A tag that does not match package.json means one of the two was missed,
      # and a build labelled with the wrong version is worse than no build.
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: ${pkg} / tag: ${tag}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json is ${pkg} but the tag is ${tag}. Fix the version before tagging."
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          npm pack --json > pack.json
          tarball=$(jq -r '.[0].filename' pack.json)
          [ -f "$tarball" ] || tarball=$(ls -1 ./*.tgz | head -n1 | xargs basename)

          name=$(jq -r '.[0].name' pack.json)
          glob=$(printf '%s' "$name" | sed 's#^@##; s#/#-#')

          {
            echo "tarball=$tarball"
            echo "glob=$glob"
            echo "version=$(jq -r '.[0].version' pack.json)"
          } >> "$GITHUB_OUTPUT"
          rm -f pack.json

      # What the changelog says about this version, for the release page. Not
      # every plugin keeps one, and a missing section is not worth failing over.
      - name: Collect the release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v want="$VERSION" '
              /^## / { on = index($0, want) > 0; next }
              on { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md" > release-notes.md
          fi

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: '*.tgz'

      # A private repository answers 404 to an unauthenticated download, and
      # `npm i <url>` has nowhere to put a token. The asset endpoint of the API
      # does take one, so the file is fetched first and installed off the disk.
      - name: Say how to install it
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          GLOB: ${{ steps.pack.outputs.glob }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            {
              echo "## Dry run"
              echo
              echo "Built and packed \`${TARBALL}\`, uploaded nothing: this run is not for a tag."
              echo "Push a \`v*\` tag to produce a real release asset."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            --jq ".assets[] | select(.name==\"$TARBALL\") | .id")
          url="https://api.github.com/repos/${{ github.repository }}/releases/assets/${id}"
          cmd="rm -f ${GLOB}-*.tgz && curl -fL -H \"Authorization: Bearer \$GITHUB_TOKEN\" -H 'Accept: application/octet-stream' -o ${TARBALL} ${url} && npm i ./${TARBALL}"

          {
            echo "## Install ${{ github.ref_name }}"
            echo
            echo "Run it in the Homebridge directory, from \`hb-shell\`."
            echo
            echo 'Needs `GITHUB_TOKEN` exported in that shell, set to a PAT that can read this repository.'
            echo
            echo '```bash'
            echo "$cmd"
            echo '```'
            echo
            echo "Then \`exit\` and \`sudo hb-service restart\`."
          } >> "$GITHUB_STEP_SUMMARY"
