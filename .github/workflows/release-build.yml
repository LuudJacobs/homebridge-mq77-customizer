# Builds a released version and hangs the tarball on that version's own
# release, so the Pi installs what GitHub compiled rather than compiling it.
#
# The test build's twin, with three differences: it runs on the version tag
# rather than on a branch, every release keeps its own asset rather than one
# rolling one, and the version is the one already in package.json rather than
# a prerelease invented here.
#
# Nothing is published to npm and no token is needed: the release is made with
# the automatic GITHUB_TOKEN.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The lowest major still maintained of the three package.json allows.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Which release this is, and what its page should say. A tag that does
      # not match the version in package.json means one of the two was missed,
      # and a build labelled with the wrong version is worse than no build.
      - name: Work out which release this is
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$version"

          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the version in package.json ($version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # What the changelog says about this version, for the release page.
          awk -v want="## [$version]" '
            index($0, want) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $version" >&2
            echo "See CHANGELOG.md" > release-notes.md
          fi

      - name: Pack
        id: pack
        run: |
          npm pack
          echo "tarball=$(ls -1 *.tgz | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Hang it on the release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: "*.tgz"

      # The whole thing, ready to paste, on the run's own page. The repository
      # is private, so the plain download URL answers 404 to anything without a
      # token and `npm install <url>` has nowhere to put one. The asset
      # endpoint of the API does take one, so the file is fetched with it and
      # installed off the disk.
      - name: Say how to install it
        env:
          ASSETS: ${{ steps.publish.outputs.assets }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          id=$(echo "$ASSETS" | jq -r --arg name "$TARBALL" '.[] | select(.name == $name) | .id')
          asset="https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
          plain="https://github.com/${{ github.repository }}/releases/download/$TAG/$TARBALL"
          {
            echo "### Install $TAG"
            echo
            echo 'In your Homebridge directory, with a token that can read this repository:'
            echo
            echo '```bash'
            echo "rm -f homebridge-mq77-customizer-*.tgz && curl -fL -H \"Authorization: Bearer \$GITHUB_TOKEN\" -H 'Accept: application/octet-stream' -o $TARBALL $asset && npm i ./$TARBALL"
            echo '```'
            echo
            echo "Then restart Homebridge. Once this repository is public, \`npm i $plain\` does the lot on its own."
          } >> "$GITHUB_STEP_SUMMARY"
