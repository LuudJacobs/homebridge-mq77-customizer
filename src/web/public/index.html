<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MQ77 Customizer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- What an iPhone or iPad puts on the home screen. Square and opaque:
         iOS rounds the corners itself and fills anything see-through with black. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="login" hidden>
      <form id="login-form">
        <h1><img class="logo" src="/favicon.svg" alt="" width="30" height="30" />MQ77 Customizer</h1>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header>
        <h1>
          <img class="logo" src="/favicon.svg" alt="" width="26" height="26" />MQ77 Customizer<span
            id="status"
            class="status"
            >connecting</span
          >
        </h1>
      </header>

      <div class="tab-bar">
        <select id="tab-select" class="tab-select" aria-label="Section"></select>

        <nav class="tabs">
          <button id="tab-devices" type="button" class="tab active">Devices</button>
          <button id="tab-automation" type="button" class="tab">Rules</button>
          <button id="tab-mirror" type="button" class="tab">Mirrors</button>
          <button id="tab-sliders" type="button" class="tab">Sliders</button>
          <button id="tab-home" type="button" class="tab">Home</button>
          <button id="tab-activity" type="button" class="tab">Log</button>
          <button id="tab-controllers" type="button" class="tab">Guide</button>
        </nav>

        <a id="zigbee2mqtt-link" class="tab tab-link" target="_blank" rel="noreferrer noopener" hidden>
          Zigbee2MQTT
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
            <path
              d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>

      <div id="tab-tools" class="tab-tools">
        <span id="kind-filters" class="kind-filters" hidden>
          <label class="toggle" for="kind-ignored">
            <input id="kind-ignored" type="checkbox" />
            Ignored rules
          </label>
        </span>
        <label id="unused-buttons-filter" class="toggle" for="unused-buttons" hidden>
          <input id="unused-buttons" type="checkbox" />
          Unused buttons
        </label>
        <label id="homekit-buttons-filter" class="toggle" for="homekit-buttons" hidden>
          <input id="homekit-buttons" type="checkbox" checked />
          HomeKit buttons
        </label>
        <select id="sort" title="Sort the list"></select>
        <input id="filter" type="search" />
        <details id="trigger-kinds" class="kind-picker" hidden>
          <summary id="trigger-kinds-label">All trigger devices</summary>
          <div id="trigger-kinds-list" class="kind-picker-list"></div>
        </details>
      </div>

      <section id="view-devices">
        <!-- The line the sort and filter sit on, with no button of its own. -->
        <div class="rules-actions">
          <span class="tab-buttons"></span>
        </div>
        <main id="devices"></main>
      </section>

      <section id="view-automation" hidden>
        <div class="rules-actions">
          <span class="tab-buttons">
            <button id="add-automation" type="button">+ rule</button>
          </span>
        </div>
        <main id="automation"></main>
      </section>

      <section id="view-mirror" hidden>
        <div class="rules-actions">
          <span class="tab-buttons">
            <button id="add-mirror" type="button">+ mirror</button>
          </span>
        </div>
        <main id="mirror"></main>
      </section>

      <section id="view-sliders" hidden>
        <div class="rules-actions">
          <span class="tab-buttons">
            <button id="add-slider" type="button">+ slider</button>
          </span>
        </div>
        <main id="sliders"></main>
      </section>


      <section id="view-home" hidden>
        <div class="home">
          <nav class="home-menu">
            <button id="home-rooms" type="button" class="home-link">Rooms</button>
            <button id="home-states" type="button" class="home-link">States</button>
            <button id="home-map" type="button" class="home-link">Zigbee map</button>
          </nav>
          <div class="home-pages">
            <div id="home-page-rooms" class="home-page">
              <div class="rules-actions">
                <span id="rooms-buttons" class="tab-buttons"></span>
              </div>
              <div id="rooms" class="rooms"></div>
            </div>
            <div id="home-page-states" class="home-page" hidden>
              <div class="rules-actions">
                <span class="tab-buttons">
                  <button id="add-state" type="button">+ state</button>
                </span>
              </div>
              <div id="states" class="states"></div>
            </div>
            <div id="home-page-map" class="home-page" hidden>
              <div class="rules-actions">
                <span class="tab-buttons">
                  <span id="map-status" class="device-meta"></span>
                  <button id="scan-map" type="button">Scan the network</button>
                </span>
              </div>
              <div id="map" class="map"><div id="map-tip" class="map-tip" hidden></div></div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-controllers" hidden>
        <div class="rules-actions">
          <span class="tab-buttons">
            <button id="download-controllers" type="button">Download</button>
          </span>
        </div>
        <div id="controllers"></div>
      </section>

      <section id="view-activity" hidden>
        <div class="rules-actions">
          <span class="tab-buttons">
            <button id="clear-log" type="button">Clear</button>
          </span>
        </div>
        <div id="activity-log" class="log"></div>
      </section>
      <footer class="page-footer">
        <span id="build" class="build"></span>
        <span class="backup-line">
          <span class="on-wide"
            >back up:
            <button id="export-settings" type="button" class="link">download</button>
            /
            <button id="import-settings" type="button" class="link">upload</button>
            -
          </span>
          <span class="on-wide">last:</span>
          <span class="on-narrow">last backup:</span>
          <span id="backup-at">never</span>
          -
          <button id="backup-now" type="button" class="link">back up now</button>
        </span>
        <button id="logout" type="button" class="link">Sign out</button>
        <input id="settings-file" type="file" accept="application/json,.json" hidden />
      </footer>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
