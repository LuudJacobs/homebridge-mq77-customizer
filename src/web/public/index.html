<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MQ77 Customizer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="login" hidden>
      <form id="login-form">
        <h1><img class="logo" src="/favicon.svg" alt="" width="30" height="30" />MQ77 Customizer</h1>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header>
        <h1><img class="logo" src="/favicon.svg" alt="" width="26" height="26" />MQ77 Customizer</h1>
        <div class="header-actions">
          <span id="status" class="status">connecting</span>
          <label class="toggle" for="exposed-only">
            <input id="exposed-only" type="checkbox" />
            In HomeKit only
          </label>
          <input id="filter" type="search" placeholder="Filter name, topic or model" />
          <button id="logout" type="button">Sign out</button>
        </div>
      </header>

      <p class="hint">
        Tick what should appear in HomeKit. Changes apply immediately, no restart.
        Everything else stays available to the rules engine.
      </p>

      <main id="devices"></main>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
